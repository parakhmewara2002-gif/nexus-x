name: Build APK

on:
  push:
    branches: [ main, liquid-glass-ui ]
    paths: [ 'android_nexus/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android_nexus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Build
        run: set -o pipefail; ./gradlew testDebugUnitTest assembleDebug --no-daemon 2>&1 | tee build.log
      - name: Surface compile errors as annotations
        if: failure()
        run: |
          grep -E '^e: |error:|What went wrong|FAILED' build.log | head -10 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-x-debug-apk
          path: android_nexus/app/build/outputs/apk/debug/*.apk
